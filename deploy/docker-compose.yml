services:
  api:
    build: ../api
    environment:
      BONDSEYE_DB_PATH: /data/bondseye.sqlite3
      BONDSEYE_API_KEY: change-me
    volumes:
      - bondseye_data:/data
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  bondseye_data:
